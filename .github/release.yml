changelog:
  exclude:
    labels:
      - ignore-for-release
      - internal
      - skip-changelog
    authors:
      - dependabot
      - renovate
  categories:
    - title: 🚀 New Features
      labels:
        - feat
        - feature
        - enhancement
        - new
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bugfix
        - bug
        - hotfix
    - title: 📚 Documentation
      labels:
        - docs
        - documentation
        - doc
    - title: ♻️ Refactoring
      labels:
        - refactor
        - refactoring
    - title: ⚡ Performance
      labels:
        - perf
        - performance
    - title: 🧪 Testing
      labels:
        - test
        - testing
    - title: 🔧 Maintenance
      labels:
        - chore
        - maintenance
        - ci
    - title: ⚠️ Breaking Changes
      labels:
        - breaking
        - breaking-change
        - BREAKING
